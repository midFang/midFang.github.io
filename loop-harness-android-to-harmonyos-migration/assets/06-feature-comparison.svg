<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fafc"/><stop offset="1" stop-color="#eef2ff"/></linearGradient>
 <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#334155" flood-opacity=".12"/></filter>
 <marker id="arrowR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#ef4444"/></marker>
 <marker id="arrowB" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#4f46e5"/></marker>
 <style>text{font-family:'Microsoft YaHei','Noto Sans SC',sans-serif}.title{font-size:30px;font-weight:700;fill:#0f172a}.sub{font-size:18px;fill:#64748b}.head{font-size:24px;font-weight:700}.boxTitle{font-size:19px;font-weight:700;fill:#0f172a}.body{font-size:16px;fill:#475569}.small{font-size:15px;fill:#64748b}.pill{font-size:15px;font-weight:700}</style>
</defs>
<rect width="1200" height="690" rx="24" fill="url(#bg)"/>
<text x="600" y="49" text-anchor="middle" class="title">同一个“清理缓存”功能，两种执行方式</text>
<text x="600" y="79" text-anchor="middle" class="sub">差别不在模型，而在模型是否先拿到可执行、可验证的标准</text>

<g filter="url(#shadow)"><rect x="45" y="112" width="530" height="520" rx="22" fill="#fff" stroke="#fecaca" stroke-width="2"/></g>
<circle cx="85" cy="154" r="20" fill="#fee2e2"/><path d="M77 146l16 16M93 146l-16 16" stroke="#dc2626" stroke-width="4" stroke-linecap="round"/>
<text x="120" y="163" class="head" fill="#b91c1c">没有工程约束：模型自己猜“完成”</text>
<rect x="78" y="198" width="464" height="68" rx="13" fill="#fff7ed" stroke="#fed7aa"/>
<text x="98" y="226" class="boxTitle">一句模糊指令</text><text x="98" y="250" class="body">“把 Android 的清理缓存迁到鸿蒙”</text>
<path d="M310 273v30" stroke="#ef4444" stroke-width="3" marker-end="url(#arrowR)"/>
<rect x="78" y="312" width="464" height="78" rx="13" fill="#fef2f2" stroke="#fecaca"/>
<text x="98" y="340" class="boxTitle">只实现最显眼的主路径</text><text x="98" y="366" class="body">按钮可点击 → 调用方法 → 弹出“完成”</text>
<path d="M310 397v30" stroke="#ef4444" stroke-width="3" marker-end="url(#arrowR)"/>
<rect x="78" y="436" width="464" height="126" rx="13" fill="#fff1f2" stroke="#fecdd3"/>
<text x="98" y="465" class="boxTitle">隐藏分支没有统一标准</text>
<text x="98" y="493" class="body">漏掉：二次确认、执行中禁用、取消</text>
<text x="98" y="519" class="body">漏掉：失败、无权限、重复点击、数据刷新</text>
<text x="98" y="546" class="small">结果：靠人工测试发现，再多轮返工</text>
<rect x="169" y="582" width="282" height="34" rx="17" fill="#fee2e2"/><text x="310" y="605" text-anchor="middle" class="pill" fill="#b91c1c">能跑 ≠ 完整迁移</text>

<g filter="url(#shadow)"><rect x="625" y="112" width="530" height="520" rx="22" fill="#fff" stroke="#c7d2fe" stroke-width="2"/></g>
<circle cx="665" cy="154" r="20" fill="#e0e7ff"/><path d="M656 154l6 7 13-16" fill="none" stroke="#4338ca" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="700" y="163" class="head" fill="#3730a3">使用 Loop Harness：先定义完成标准</text>
<g>
 <rect x="658" y="198" width="206" height="67" rx="13" fill="#eef2ff" stroke="#c7d2fe"/><text x="761" y="225" text-anchor="middle" class="boxTitle">① 反读 Android</text><text x="761" y="249" text-anchor="middle" class="small">列出真实入口与分支</text>
 <rect x="916" y="198" width="206" height="67" rx="13" fill="#eef2ff" stroke="#c7d2fe"/><text x="1019" y="225" text-anchor="middle" class="boxTitle">② 建立功能契约</text><text x="1019" y="249" text-anchor="middle" class="small">把“完成”写成清单</text>
 <path d="M870 232h36" stroke="#4f46e5" stroke-width="3" marker-end="url(#arrowB)"/>
 <rect x="658" y="302" width="206" height="67" rx="13" fill="#eef2ff" stroke="#c7d2fe"/><text x="761" y="329" text-anchor="middle" class="boxTitle">③ 按契约实现</text><text x="761" y="353" text-anchor="middle" class="small">覆盖主路径与异常态</text>
 <rect x="916" y="302" width="206" height="67" rx="13" fill="#eef2ff" stroke="#c7d2fe"/><text x="1019" y="329" text-anchor="middle" class="boxTitle">④ 验证 + 二审</text><text x="1019" y="353" text-anchor="middle" class="small">反向核对 Android 基准</text>
 <path d="M870 336h36" stroke="#4f46e5" stroke-width="3" marker-end="url(#arrowB)"/>
 <rect x="658" y="406" width="206" height="67" rx="13" fill="#eef2ff" stroke="#c7d2fe"/><text x="761" y="433" text-anchor="middle" class="boxTitle">⑤ 记录差异</text><text x="761" y="457" text-anchor="middle" class="small">平台差异不静默跳过</text>
 <rect x="916" y="406" width="206" height="67" rx="13" fill="#eef2ff" stroke="#c7d2fe"/><text x="1019" y="433" text-anchor="middle" class="boxTitle">⑥ 更新状态并提交</text><text x="1019" y="457" text-anchor="middle" class="small">保存进度与恢复点</text>
 <path d="M870 440h36" stroke="#4f46e5" stroke-width="3" marker-end="url(#arrowB)"/>
</g>
<rect x="658" y="510" width="464" height="52" rx="13" fill="#ecfdf5" stroke="#a7f3d0"/><text x="890" y="542" text-anchor="middle" class="boxTitle" fill="#047857">Loop 读取台账，自动选择下一项继续执行</text>
<rect x="749" y="582" width="282" height="34" rx="17" fill="#e0e7ff"/><text x="890" y="605" text-anchor="middle" class="pill" fill="#3730a3">完成 = 逐项满足可检查标准</text>
</svg>