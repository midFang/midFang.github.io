</style>
<text x="70" y="70" class="title">规则不是一份超长 Prompt，而是一张按需读取的路由图</text>
<text x="70" y="108" class="sub">稳定规则常驻，任务细节进入契约，执行事实沉淀到状态与差异台账</text>
<rect x="510" y="145" width="380" height="90" rx="20" fill="#14213D"/><text x="700" y="200" text-anchor="middle" class="h white">AGENTS.md</text>
<path d="M700 235 V300" stroke="#5B6B88" stroke-width="3"/>
<rect x="80" y="300" width="190" height="90" rx="16" fill="#E8F0FF" stroke="#7297F5"/><text x="175" y="355" text-anchor="middle" class="h">UI / 页面</text>
<rect x="290" y="300" width="190" height="90" rx="16" fill="#E8F0FF" stroke="#7297F5"/><text x="385" y="355" text-anchor="middle" class="h">功能</text>
<rect x="500" y="300" width="190" height="90" rx="16" fill="#E8F0FF" stroke="#7297F5"/><text x="595" y="355" text-anchor="middle" class="h">资源</text>
<rect x="710" y="300" width="190" height="90" rx="16" fill="#E8F0FF" stroke="#7297F5"/><text x="805" y="355" text-anchor="middle" class="h">数据 / 存储</text>
<rect x="920" y="300" width="190" height="90" rx="16" fill="#E8F0FF" stroke="#7297F5"/><text x="1015" y="355" text-anchor="middle" class="h">权限 / 系统</text>
<rect x="1130" y="300" width="190" height="90" rx="16" fill="#E8F0FF" stroke="#7297F5"/><text x="1225" y="355" text-anchor="middle" class="h">二次审查</text>
<path d="M700 275 H175 V300 M700 275 H385 V300 M700 275 H595 V300 M700 275 H805 V300 M700 275 H1015 V300 M700 275 H1225 V300" fill="none" stroke="#5B6B88" stroke-width="2"/>
<rect x="125" y="500" width="330" height="120" rx="20" fill="#fff" stroke="#56B88A"/><text x="290" y="545" text-anchor="middle" class="h">页面 / 功能契约</text><text x="290" y="580" text-anchor="middle" class="t">把“完成”改写成可检查条目</text>
<rect x="535" y="500" width="330" height="120" rx="20" fill="#fff" stroke="#E7B75C"/><text x="700" y="545" text-anchor="middle" class="h">migration-status.md</text><text x="700" y="580" text-anchor="middle" class="t">下一步从文件状态中选择</text>
<rect x="945" y="500" width="330" height="120" rx="20" fill="#fff" stroke="#E47C7C"/><text x="1110" y="545" text-anchor="middle" class="h">difference-log.md</text><text x="1110" y="580" text-anchor="middle" class="t">差异不藏在对话和记忆里</text>
<path d="M455 560 H535 M865 560 H945" stroke="#5B6B88" stroke-width="3" marker-end="url(#a)"/>
<rect x="240" y="690" width="920" height="65" rx="16" fill="#E8FFF5"/><text x="700" y="731" text-anchor="middle" class="t">结果：上下文可以重建，Agent 重启、压缩上下文或换模型后仍能继续</text>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#5B6B88"/></marker></defs>
