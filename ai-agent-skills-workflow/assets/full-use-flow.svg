<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="920" viewBox="0 0 1500 920">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7fbff"/>
      <stop offset="100%" stop-color="#eef7f0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#19324d" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#39546b"/>
    </marker>
    <style>
      .title{font:700 34px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#16324f}
      .sub{font:400 16px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#5a6b7a}
      .box{fill:#fff;stroke:#c8d8e8;stroke-width:2;rx:18;filter:url(#shadow)}
      .human{fill:#fff7e6;stroke:#f2b84b}
      .agent{fill:#edf6ff;stroke:#69a9e9}
      .artifact{fill:#f2fff5;stroke:#71c987}
      .danger{fill:#fff0f0;stroke:#e27b7b}
      .h{font:700 19px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#16324f}
      .p{font:400 14px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#41566b}
      .small{font:400 12px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#617387}
      .arrow{stroke:#39546b;stroke-width:2.4;fill:none;marker-end:url(#arrow)}
      .dash{stroke:#8798aa;stroke-width:2;stroke-dasharray:7 6;fill:none;marker-end:url(#arrow)}
      .lane{font:700 15px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#2b4b65}
    </style>
  </defs>
  <rect width="1500" height="920" rx="28" fill="url(#bg)"/>
  <text x="54" y="58" class="title">AI Agent Skills 完整使用流程</text>
  <text x="56" y="88" class="sub">从表格导入、任务拆分、Worktree 修复、APK 验证，到合并、集成验证和清理：关键节点由 Agent 执行，验收节点由人确认。</text>

  <text x="72" y="137" class="lane">输入与整理</text>
  <text x="72" y="345" class="lane">开发与自证</text>
  <text x="72" y="555" class="lane">人工验收</text>
  <text x="72" y="765" class="lane">合并与清理</text>

  <!-- row 1 -->
  <rect x="170" y="115" width="190" height="96" class="box human"/>
  <text x="190" y="148" class="h">在线表格 / 需求</text>
  <text x="190" y="174" class="p">Bug tab、功能想法</text>
  <text x="190" y="194" class="small">由人提供入口</text>

  <rect x="430" y="115" width="190" height="96" class="box agent"/>
  <text x="455" y="148" class="h">bug2csv</text>
  <text x="455" y="174" class="p">导出目标 tab</text>
  <text x="455" y="194" class="small">只生成需要的 CSV</text>

  <rect x="690" y="115" width="210" height="96" class="box agent"/>
  <text x="715" y="148" class="h">bugbatch-prepare</text>
  <text x="715" y="174" class="p">拆成任务与状态表</text>
  <text x="715" y="194" class="small">ready / needs_info</text>

  <rect x="970" y="115" width="250" height="96" class="box human"/>
  <text x="995" y="148" class="h">人工 Review 任务</text>
  <text x="995" y="174" class="p">确认描述、优先级、验收口径</text>
  <text x="995" y="194" class="small">信息不足则补充后再执行</text>

  <!-- row 2 -->
  <rect x="170" y="325" width="230" height="108" class="box agent"/>
  <text x="195" y="360" class="h">bugfix-worktree</text>
  <text x="195" y="386" class="p">创建独立 worktree / 分支</text>
  <text x="195" y="408" class="small">只围绕一个 Bug 修改</text>

  <rect x="470" y="325" width="220" height="108" class="box agent"/>
  <text x="495" y="360" class="h">修复 + 自证</text>
  <text x="495" y="386" class="p">测试、构建、记录风险</text>
  <text x="495" y="408" class="small">TASK 中沉淀过程</text>

  <rect x="760" y="325" width="220" height="108" class="box artifact"/>
  <text x="785" y="360" class="h">准备待测 APK</text>
  <text x="785" y="386" class="p">输出到 apks/BUG-xxx.apk</text>
  <text x="785" y="408" class="small">CSV 记录 apk_path</text>

  <rect x="1050" y="325" width="230" height="108" class="box human"/>
  <text x="1075" y="360" class="h">人工 Review Diff</text>
  <text x="1075" y="386" class="p">看改动范围、风险、注释</text>
  <text x="1075" y="408" class="small">不通过则退回继续修</text>

  <!-- row 3 -->
  <rect x="170" y="535" width="230" height="108" class="box human"/>
  <text x="195" y="570" class="h">安装待测 APK</text>
  <text x="195" y="596" class="p">adb install 或手动安装</text>
  <text x="195" y="618" class="small">以真实设备验证为准</text>

  <rect x="470" y="535" width="230" height="108" class="box human"/>
  <text x="495" y="570" class="h">复现场景验证</text>
  <text x="495" y="596" class="p">按 TASK 的待人工验证项执行</text>
  <text x="495" y="618" class="small">通过 / 不通过明确反馈</text>

  <rect x="760" y="535" width="230" height="108" class="box danger"/>
  <text x="785" y="570" class="h">未通过</text>
  <text x="785" y="596" class="p">回到 worktree 继续修</text>
  <text x="785" y="618" class="small">保留上下文和验证记录</text>

  <rect x="1050" y="535" width="230" height="108" class="box artifact"/>
  <text x="1075" y="570" class="h">单 Bug 通过</text>
  <text x="1075" y="596" class="p">用户明确确认可合并</text>
  <text x="1075" y="618" class="small">必须指定目标分支</text>

  <!-- row 4 -->
  <rect x="170" y="745" width="230" height="108" class="box agent"/>
  <text x="195" y="780" class="h">bugfix-done</text>
  <text x="195" y="806" class="p">合并到目标分支</text>
  <text x="195" y="828" class="small">更新 CSV / TASK 状态</text>

  <rect x="470" y="745" width="230" height="108" class="box artifact"/>
  <text x="495" y="780" class="h">构建合并后 APK</text>
  <text x="495" y="806" class="p">目标分支集成产物</text>
  <text x="495" y="828" class="small">用于二次验证</text>

  <rect x="760" y="745" width="230" height="108" class="box human"/>
  <text x="785" y="780" class="h">集成验证</text>
  <text x="785" y="806" class="p">安装合并后 APK 再跑一遍</text>
  <text x="785" y="828" class="small">确认没有回归</text>

  <rect x="1050" y="745" width="230" height="108" class="box agent"/>
  <text x="1075" y="780" class="h">清理现场</text>
  <text x="1075" y="806" class="p">删除 worktree / 临时日志</text>
  <text x="1075" y="828" class="small">任务状态进入 done</text>

  <!-- arrows -->
  <path d="M360 163 L430 163" class="arrow"/>
  <path d="M620 163 L690 163" class="arrow"/>
  <path d="M900 163 L970 163" class="arrow"/>
  <path d="M1095 211 C1095 275 285 270 285 325" class="arrow"/>

  <path d="M400 379 L470 379" class="arrow"/>
  <path d="M690 379 L760 379" class="arrow"/>
  <path d="M980 379 L1050 379" class="arrow"/>
  <path d="M1165 433 C1165 500 285 492 285 535" class="arrow"/>

  <path d="M400 589 L470 589" class="arrow"/>
  <path d="M700 589 L760 589" class="arrow"/>
  <path d="M990 589 L1050 589" class="arrow"/>
  <path d="M875 535 C875 480 285 480 285 433" class="dash"/>
  <path d="M1165 643 C1165 710 285 700 285 745" class="arrow"/>

  <path d="M400 799 L470 799" class="arrow"/>
  <path d="M700 799 L760 799" class="arrow"/>
  <path d="M990 799 L1050 799" class="arrow"/>

  <text x="86" y="900" class="small">颜色说明：蓝色=Agent 执行，黄色=人工确认，绿色=产物/状态，红色=回退路径。</text>
</svg>
