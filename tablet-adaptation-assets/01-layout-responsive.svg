<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620">
  <defs>
    <linearGradient id="phone" x1="0" x2="1"><stop offset="0" stop-color="#e0f2fe"/><stop offset="1" stop-color="#dbeafe"/></linearGradient>
    <linearGradient id="pad" x1="0" x2="1"><stop offset="0" stop-color="#dcfce7"/><stop offset="1" stop-color="#ecfccb"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-opacity="0.16"/></filter>
    <style>
      .title{font:700 34px Arial,'Microsoft YaHei',sans-serif;fill:#0f172a}.sub{font:500 20px Arial,'Microsoft YaHei',sans-serif;fill:#334155}.small{font:500 16px Arial,'Microsoft YaHei',sans-serif;fill:#475569}.label{font:700 21px Arial,'Microsoft YaHei',sans-serif;fill:#111827}.code{font:600 15px Consolas,monospace;fill:#1e293b}.box{stroke:#0f172a;stroke-width:3;rx:28;filter:url(#shadow)}.pane{stroke:#334155;stroke-width:2;rx:18}.arrow{stroke:#334155;stroke-width:3;fill:none;marker-end:url(#m)}
    </style>
    <marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker>
  </defs>
  <rect width="1200" height="620" fill="#f8fafc"/>
  <text x="60" y="62" class="title">同一份返回栈：手机全屏，平板横屏双栏</text>
  <text x="60" y="96" class="sub">项目没有为 Android / iOS 分别写两套平板页面，而是在 commonMain 里用 Navigation 3 SceneStrategy 改变渲染形态。</text>
  <g transform="translate(90,150)">
    <rect class="box" width="330" height="410" fill="url(#phone)"/>
    <text x="165" y="46" text-anchor="middle" class="label">手机 / 竖屏</text>
    <rect x="42" y="80" width="246" height="250" class="pane" fill="#ffffff"/>
    <text x="165" y="150" text-anchor="middle" class="label">单页全屏</text>
    <text x="165" y="185" text-anchor="middle" class="small">Home → Feature → SubPage</text>
    <text x="165" y="218" text-anchor="middle" class="small">每次 push 都覆盖整屏</text>
    <rect x="42" y="350" width="246" height="34" rx="17" fill="#bfdbfe"/>
    <text x="165" y="373" text-anchor="middle" class="code">SceneStrategy 返回 null</text>
  </g>
  <path d="M465 350 C515 310, 545 310, 595 350" class="arrow"/>
  <g transform="translate(650,150)">
    <rect class="box" width="460" height="410" fill="url(#pad)"/>
    <text x="230" y="46" text-anchor="middle" class="label">平板 / 横屏</text>
    <rect x="38" y="82" width="140" height="255" class="pane" fill="#ffffff"/>
    <rect x="196" y="82" width="226" height="255" class="pane" fill="#ffffff"/>
    <text x="108" y="135" text-anchor="middle" class="label">start pane</text>
    <text x="108" y="168" text-anchor="middle" class="small">模块 / 登录</text>
    <text x="108" y="199" text-anchor="middle" class="small">约 35%</text>
    <text x="309" y="135" text-anchor="middle" class="label">end pane</text>
    <text x="309" y="168" text-anchor="middle" class="small">功能详情链路</text>
    <text x="309" y="199" text-anchor="middle" class="small">约 65%</text>
    <rect x="38" y="350" width="384" height="34" rx="17" fill="#bbf7d0"/>
    <text x="230" y="373" text-anchor="middle" class="code">width ≥ Medium 且 width > height</text>
  </g>
</svg>